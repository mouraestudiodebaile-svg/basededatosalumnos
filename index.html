<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MouraEstudio - Gestión de Alumnos</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* ===== ESTILOS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #f7f0fc 0%, #e9dff5 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 35px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #d4c0e8;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #3d2a5c;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: #b77cdb;
            font-size: 2rem;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-badge {
            background: #3d2a5c;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(61, 42, 92, 0.3);
        }

        .header-badge i {
            margin-right: 8px;
        }

        /* Estadísticas */
        .stats {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            background: #f3ebfa;
            padding: 15px 25px;
            border-radius: 60px;
            justify-content: center;
        }

        .stats span {
            font-weight: 600;
            color: #2d1d44;
            font-size: 1rem;
        }

        .stats span i {
            margin-right: 8px;
            color: #8b5eb0;
        }

        .stats .num {
            background: #3d2a5c;
            color: white;
            padding: 0 12px;
            border-radius: 30px;
            margin-left: 6px;
            font-size: 0.9rem;
        }

        /* Formulario */
        .form-section {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 25px 25px 20px;
            margin-bottom: 35px;
            box-shadow: 0 8px 20px rgba(90, 50, 120, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #3d2a5c;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border-radius: 30px;
            border: 1.5px solid #d4c0e8;
            background: white;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
            width: 100%;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #8b5eb0;
            box-shadow: 0 0 0 4px rgba(139, 94, 176, 0.15);
        }

        /* Multi-select de disciplinas */
        .disciplinas-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 0;
            min-height: 50px;
            align-items: center;
        }

        .disciplina-tag {
            background: #8b5eb0;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            cursor: default;
            animation: fadeIn 0.3s ease;
        }

        .disciplina-tag i {
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.8;
            transition: 0.2s;
        }

        .disciplina-tag i:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .disciplina-select-wrapper {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .disciplina-select-wrapper select {
            flex: 1;
            min-width: 150px;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1.5px solid #d4c0e8;
            background: white;
            font-size: 0.95rem;
            outline: none;
        }

        .disciplina-select-wrapper select:focus {
            border-color: #8b5eb0;
            box-shadow: 0 0 0 4px rgba(139, 94, 176, 0.15);
        }

        .btn-add-disciplina {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: #3d2a5c;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-add-disciplina:hover {
            background: #5a3d7a;
            transform: scale(1.05);
        }

        .btn-add-disciplina:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .disciplinas-empty {
            color: #8a7a9e;
            font-style: italic;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 8px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #3d2a5c;
            color: white;
            box-shadow: 0 6px 14px rgba(61, 42, 92, 0.25);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(61, 42, 92, 0.3);
        }

        .btn-primary {
            background: #8b5eb0;
        }

        .btn-primary:hover {
            background: #7a4da0;
        }

        .btn-danger {
            background: #d14c6a;
        }

        .btn-danger:hover {
            background: #b83e5a;
        }

        .btn-warning {
            background: #e6a653;
        }

        .btn-warning:hover {
            background: #d4943f;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
            gap: 6px;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #8b5eb0;
            color: #3d2a5c;
            box-shadow: none;
        }

        .btn-outline:hover {
            background: #8b5eb0;
            color: white;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 48px;
            border-radius: 40px;
            border: 1.5px solid #d4c0e8;
            font-size: 1rem;
            background: white;
            transition: 0.2s;
            outline: none;
        }

        .search-box input:focus {
            border-color: #8b5eb0;
            box-shadow: 0 0 0 4px rgba(139, 94, 176, 0.12);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b5eb0;
            font-size: 1.1rem;
        }

        .filter-select {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-select select {
            padding: 10px 18px;
            border-radius: 40px;
            border: 1.5px solid #d4c0e8;
            background: white;
            font-weight: 500;
            outline: none;
        }

        /* Tabla */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 24px;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            border: 1px solid #ede6f5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 700px;
        }

        th {
            background: #f3ebfa;
            color: #2d1d44;
            font-weight: 700;
            padding: 18px 16px;
            text-align: left;
            border-bottom: 2px solid #d4c0e8;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f0e8f8;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #faf7fd;
        }

        .estado-badge {
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
        }

        .estado-activo {
            background: #d4edda;
            color: #155724;
        }

        .estado-inactivo {
            background: #f8d7da;
            color: #721c24;
        }

        .estado-prueba {
            background: #fff3cd;
            color: #856404;
        }

        .disciplinas-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .disciplinas-cell .tag {
            background: #f0e8f8;
            color: #3d2a5c;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty-row td {
            text-align: center;
            padding: 40px 20px;
            color: #8a7a9e;
            font-style: italic;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 700px) {
            .container {
                padding: 20px 15px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
            .stats {
                gap: 12px;
                font-size: 0.9rem;
                padding: 12px 18px;
            }
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .disciplina-select-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f0e8f8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b77cdb;
            border-radius: 10px;
        }

        .sync-status {
            font-size: 0.8rem;
            color: #6b5a7e;
            padding: 4px 12px;
            background: #f0e8f8;
            border-radius: 20px;
        }

        .sync-status.synced {
            color: #28a745;
        }

        .sync-status.syncing {
            color: #e6a653;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        .backup-section {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
            border-top: 1px solid #d4c0e8;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <!-- ===== MAIN APP ===== -->
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1><i class="fas fa-user-graduate"></i> MouraEstudio</h1>
            <div class="header-actions">
                <span class="sync-status" id="syncStatus"><i class="fas fa-cloud"></i> Conectado</span>
                <span class="header-badge"><i class="fas fa-users"></i> Gestión de Alumnos</span>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="stats" id="statsContainer">
            <span><i class="fas fa-user"></i> Total: <span class="num" id="totalCount">0</span></span>
            <span><i class="fas fa-check-circle"></i> Activos: <span class="num" id="activosCount">0</span></span>
            <span><i class="fas fa-hourglass-half"></i> Prueba: <span class="num" id="pruebaCount">0</span></span>
            <span><i class="fas fa-times-circle"></i> Inactivos: <span class="num" id="inactivosCount">0</span></span>
        </div>

        <!-- Formulario -->
        <div class="form-section">
            <form id="userForm" class="form-grid">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Ana Moura" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="ana@mouraestudio.com" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Teléfono</label>
                    <input type="text" id="telefono" placeholder="+34 600 000 000" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-music"></i> Disciplinas</label>
                    <div class="disciplinas-container" id="disciplinasContainer">
                        <span class="disciplinas-empty" id="disciplinasEmpty">No hay disciplinas seleccionadas</span>
                    </div>
                    <div class="disciplina-select-wrapper">
                        <select id="disciplinaSelect">
                            <option value="Ballet">Ballet</option>
                            <option value="Danza Contemporánea">Danza Contemporánea</option>
                            <option value="Flamenco">Flamenco</option>
                            <option value="Hip Hop">Hip Hop</option>
                            <option value="Jazz">Jazz</option>
                            <option value="Salsa">Salsa</option>
                            <option value="Zumba">Zumba</option>
                            <option value="Pilates">Pilates</option>
                            <option value="K-Pop">K-Pop</option>
                            <option value="Danza del Vientre">Danza del Vientre</option>
                            <option value="Otro">Otro</option>
                        </select>
                        <button type="button" class="btn-add-disciplina" id="addDisciplinaBtn">
                            <i class="fas fa-plus"></i> Añadir
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-chart-simple"></i> Nivel</label>
                    <select id="nivel">
                        <option value="Iniciación">Iniciación</option>
                        <option value="Intermedio" selected>Intermedio</option>
                        <option value="Avanzado">Avanzado</option>
                        <option value="Profesional">Profesional</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-circle"></i> Estado</label>
                    <select id="estado">
                        <option value="Activo">Activo</option>
                        <option value="Prueba">Prueba</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn"><i class="fas fa-plus-circle"></i> Agregar</button>
                    <button type="button" class="btn btn-outline" id="cancelBtn" style="display:none;"><i class="fas fa-times"></i> Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Barra de herramientas -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nombre, email o disciplina..." />
            </div>
            <div class="filter-select">
                <select id="filterEstado">
                    <option value="todos">Todos los estados</option>
                    <option value="Activo">Activo</option>
                    <option value="Prueba">Prueba</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
                <button class="btn btn-sm btn-warning" id="clearFiltersBtn"><i class="fas fa-undo"></i> Limpiar</button>
            </div>
        </div>

        <!-- Tabla -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Disciplinas</th>
                        <th>Nivel</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr class="empty-row"><td colspan="7">Cargando alumnos...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Botones de utilidad -->
        <div class="backup-section">
            <button class="btn btn-sm btn-primary" id="exportBtn"><i class="fas fa-file-export"></i> Exportar CSV</button>
            <button class="btn btn-sm btn-danger" id="clearAllBtn"><i class="fas fa-trash-alt"></i> Eliminar todos</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDYHr2Sn6Z7j53fFzF2-L7VEn0lf-xajTI",
            authDomain: "mourabasededatos.firebaseapp.com",
            projectId: "mourabasededatos",
            storageBucket: "mourabasededatos.firebasestorage.app",
            messagingSenderId: "249841630599",
            appId: "1:249841630599:web:afca20ea6deeb119c66722"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const collectionRef = db.collection('alumnos');

        // ============================================================
        // 2. REFERENCIAS DOM
        // ============================================================
        const userForm = document.getElementById('userForm');
        const nombreInput = document.getElementById('nombre');
        const emailInput = document.getElementById('email');
        const telefonoInput = document.getElementById('telefono');
        const disciplinaSelect = document.getElementById('disciplinaSelect');
        const addDisciplinaBtn = document.getElementById('addDisciplinaBtn');
        const disciplinasContainer = document.getElementById('disciplinasContainer');
        const disciplinasEmpty = document.getElementById('disciplinasEmpty');
        const nivelSelect = document.getElementById('nivel');
        const estadoSelect = document.getElementById('estado');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const tableBody = document.getElementById('userTableBody');
        const searchInput = document.getElementById('searchInput');
        const filterEstado = document.getElementById('filterEstado');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const syncStatus = document.getElementById('syncStatus');
        const exportBtn = document.getElementById('exportBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');

        const totalSpan = document.getElementById('totalCount');
        const activosSpan = document.getElementById('activosCount');
        const pruebaSpan = document.getElementById('pruebaCount');
        const inactivosSpan = document.getElementById('inactivosCount');

        // ============================================================
        // 3. ESTADO
        // ============================================================
        let users = [];
        let editingId = null;
        let isLoading = false;
        let unsubscribe = null;
        let disciplinasSeleccionadas = [];

        // ============================================================
        // 4. FUNCIONES DE UI - DISCIPLINAS
        // ============================================================
        function renderDisciplinas() {
            disciplinasContainer.innerHTML = '';
            if (disciplinasSeleccionadas.length === 0) {
                disciplinasContainer.innerHTML =
                    '<span class="disciplinas-empty">No hay disciplinas seleccionadas</span>';
                return;
            }

            disciplinasSeleccionadas.forEach((disc, index) => {
                const tag = document.createElement('span');
                tag.className = 'disciplina-tag';
                tag.innerHTML = `
                        ${disc}
                        <i class="fas fa-times" data-index="${index}"></i>
                    `;
                disciplinasContainer.appendChild(tag);
            });

            // Event listener para eliminar disciplinas
            document.querySelectorAll('.disciplina-tag i').forEach(icon => {
                icon.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const index = parseInt(this.dataset.index);
                    disciplinasSeleccionadas.splice(index, 1);
                    renderDisciplinas();
                });
            });
        }

        function addDisciplina() {
            const value = disciplinaSelect.value;
            if (!disciplinasSeleccionadas.includes(value)) {
                disciplinasSeleccionadas.push(value);
                renderDisciplinas();
            } else {
                alert('Esta disciplina ya está seleccionada');
            }
        }

        function setDisciplinas(list) {
            disciplinasSeleccionadas = list || [];
            renderDisciplinas();
        }

        // ============================================================
        // 5. FUNCIONES DE UI - GENERAL
        // ============================================================
        function setLoading(loading) {
            isLoading = loading;
            submitBtn.disabled = loading;
            if (loading) {
                submitBtn.innerHTML = '<span class="spinner"></span> Guardando...';
            } else {
                submitBtn.innerHTML = editingId ? '<i class="fas fa-save"></i> Actualizar' :
                    '<i class="fas fa-plus-circle"></i> Agregar';
            }
        }

        function updateSyncStatus(status, message) {
            syncStatus.className = 'sync-status ' + status;
            syncStatus.innerHTML = `<i class="fas fa-cloud"></i> ${message}`;
        }

        function resetForm() {
            userForm.reset();
            editingId = null;
            disciplinasSeleccionadas = [];
            renderDisciplinas();
            submitBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Agregar';
            cancelBtn.style.display = 'none';
            nombreInput.focus();
        }

        function startEdit(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;
            editingId = id;
            nombreInput.value = user.nombre;
            emailInput.value = user.email;
            telefonoInput.value = user.telefono || '';
            setDisciplinas(user.disciplinas || []);
            nivelSelect.value = user.nivel;
            estadoSelect.value = user.estado;
            submitBtn.innerHTML = '<i class="fas fa-save"></i> Actualizar';
            cancelBtn.style.display = 'inline-flex';
            nombreInput.focus();
        }

        function cancelEdit() {
            resetForm();
        }

        // ============================================================
        // 6. RENDERIZADO
        // ============================================================
        function renderStats() {
            const total = users.length;
            const activos = users.filter(u => u.estado === 'Activo').length;
            const prueba = users.filter(u => u.estado === 'Prueba').length;
            const inactivos = users.filter(u => u.estado === 'Inactivo').length;
            totalSpan.textContent = total;
            activosSpan.textContent = activos;
            pruebaSpan.textContent = prueba;
            inactivosSpan.textContent = inactivos;
        }

        function renderTable() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const estadoFilter = filterEstado.value;

            let filtered = users.filter(u => {
                const matchSearch = u.nombre.toLowerCase().includes(searchTerm) ||
                    u.email.toLowerCase().includes(searchTerm) ||
                    (u.disciplinas && u.disciplinas.some(d => d.toLowerCase().includes(searchTerm)));
                const matchEstado = estadoFilter === 'todos' || u.estado === estadoFilter;
                return matchSearch && matchEstado;
            });

            if (filtered.length === 0) {
                tableBody.innerHTML =
                    `<tr class="empty-row"><td colspan="7">${isLoading ? 'Cargando...' : 'No hay alumnos que coincidan con los criterios'}</td></tr>`;
            } else {
                tableBody.innerHTML = filtered.map(u => `
                        <tr>
                            <td><strong>${escapeHtml(u.nombre)}</strong></td>
                            <td>${escapeHtml(u.email)}</td>
                            <td>${escapeHtml(u.telefono || '-')}</td>
                            <td>
                                <div class="disciplinas-cell">
                                    ${(u.disciplinas || []).map(d => `<span class="tag">${escapeHtml(d)}</span>`).join('') || '-'}
                                </div>
                            </td>
                            <td>${escapeHtml(u.nivel)}</td>
                            <td><span class="estado-badge estado-${u.estado.toLowerCase()}">${escapeHtml(u.estado)}</span></td>
                            <td>
                                <div class="acciones">
                                    <button class="btn btn-sm btn-primary btn-edit" data-id="${u.id}"><i class="fas fa-pen"></i></button>
                                    <button class="btn btn-sm btn-danger btn-delete" data-id="${u.id}"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
            }

            renderStats();

            // Event listeners para acciones - USANDO DELEGACIÓN DE EVENTOS
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    startEdit(id);
                });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    deleteUser(id);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 7. CRUD CON FIRESTORE
        // ============================================================
        async function loadUsers() {
            try {
                updateSyncStatus('syncing', 'Cargando datos...');
                const snapshot = await collectionRef.orderBy('nombre').get();

                users = [];
                snapshot.forEach(doc => {
                    users.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                renderTable();
                updateSyncStatus('synced', `${users.length} alumnos cargados`);
            } catch (error) {
                console.error('Error al cargar usuarios:', error);
                updateSyncStatus('synced', 'Error al cargar');
                tableBody.innerHTML =
                `<tr class="empty-row"><td colspan="7">Error al cargar datos: ${error.message}</td></tr>`;
            }
        }

        function listenToUsers() {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }

            try {
                updateSyncStatus('syncing', 'Escuchando cambios...');

                unsubscribe = collectionRef.orderBy('nombre').onSnapshot((snapshot) => {
                    users = [];
                    snapshot.forEach(doc => {
                        users.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    renderTable();
                    updateSyncStatus('synced', `${users.length} alumnos sincronizados`);
                }, (error) => {
                    console.error('Error en snapshot:', error);
                    updateSyncStatus('synced', 'Error en tiempo real');
                });
            } catch (error) {
                console.error('Error al configurar listener:', error);
            }
        }

        async function addUserToFirebase(userData) {
            try {
                setLoading(true);
                await collectionRef.add(userData);
                resetForm();
                updateSyncStatus('synced', 'Alumno agregado');
                return true;
            } catch (error) {
                console.error('Error al agregar:', error);
                alert('Error al agregar: ' + error.message);
                return false;
            } finally {
                setLoading(false);
            }
        }

        async function updateUserInFirebase(id, userData) {
            try {
                setLoading(true);
                await collectionRef.doc(id).update(userData);
                resetForm();
                updateSyncStatus('synced', 'Alumno actualizado');
                return true;
            } catch (error) {
                console.error('Error al actualizar:', error);
                alert('Error al actualizar: ' + error.message);
                return false;
            } finally {
                setLoading(false);
            }
        }

        async function deleteUserFromFirebase(id) {
            if (!confirm('¿Eliminar este alumno permanentemente?')) return false;

            try {
                setLoading(true);
                await collectionRef.doc(id).delete();
                updateSyncStatus('synced', 'Alumno eliminado');
                return true;
            } catch (error) {
                console.error('Error al eliminar:', error);
                alert('Error al eliminar: ' + error.message);
                return false;
            } finally {
                setLoading(false);
            }
        }

        async function deleteAllUsers() {
            if (users.length === 0) {
                alert('No hay alumnos para eliminar');
                return;
            }

            if (!confirm(`¿Eliminar TODOS los ${users.length} alumnos permanentemente? Esta acción no se puede deshacer.`))
                return;

            try {
                setLoading(true);
                const batch = db.batch();
                users.forEach(u => {
                    const ref = collectionRef.doc(u.id);
                    batch.delete(ref);
                });
                await batch.commit();
                updateSyncStatus('synced', 'Todos los alumnos eliminados');
            } catch (error) {
                console.error('Error al eliminar todos:', error);
                alert('Error al eliminar: ' + error.message);
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // 8. WRAPPER PARA CRUD (desde UI)
        // ============================================================
        function deleteUser(id) {
            deleteUserFromFirebase(id);
        }

        // ============================================================
        // 9. HANDLERS DE FORMULARIO
        // ============================================================
        async function handleSubmit(e) {
            e.preventDefault();

            const nombre = nombreInput.value.trim();
            const email = emailInput.value.trim();
            const telefono = telefonoInput.value.trim();
            const disciplinas = disciplinasSeleccionadas.length > 0 ? disciplinasSeleccionadas : [];
            const nivel = nivelSelect.value;
            const estado = estadoSelect.value;

            if (!nombre || !email) {
                alert('Nombre y email son obligatorios');
                return;
            }

            if (disciplinas.length === 0) {
                alert('Debes seleccionar al menos una disciplina');
                return;
            }

            const userData = { nombre, email, telefono, disciplinas, nivel, estado };

            if (editingId !== null) {
                await updateUserInFirebase(editingId, userData);
            } else {
                await addUserToFirebase(userData);
            }
        }

        // ============================================================
        // 10. EXPORTAR CSV
        // ============================================================
        function exportCSV() {
            if (users.length === 0) {
                alert('No hay datos para exportar');
                return;
            }

            const headers = ['Nombre', 'Email', 'Teléfono', 'Disciplinas', 'Nivel', 'Estado'];
            const rows = users.map(u => [
                u.nombre,
                u.email,
                u.telefono || '',
                (u.disciplinas || []).join(' / '),
                u.nivel,
                u.estado
            ]);

            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${cell.replace(/"/g, '""')}"`).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `mouraestudio_alumnos_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // 11. INICIALIZACIÓN Y EVENTOS
        // ============================================================
        function init() {
            listenToUsers();
            loadUsers();
        }

        // Event listeners
        userForm.addEventListener('submit', handleSubmit);
        cancelBtn.addEventListener('click', cancelEdit);
        addDisciplinaBtn.addEventListener('click', addDisciplina);
        disciplinaSelect.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addDisciplina();
            }
        });
        searchInput.addEventListener('input', renderTable);
        filterEstado.addEventListener('change', renderTable);
        clearFiltersBtn.addEventListener('click', function() {
            searchInput.value = '';
            filterEstado.value = 'todos';
            renderTable();
        });
        exportBtn.addEventListener('click', exportCSV);
        clearAllBtn.addEventListener('click', deleteAllUsers);

        // Iniciar
        init();
        console.log('🚀 MouraEstudio - Gestión con Firebase (sin autenticación)');
        console.log('📊 Conectado a:', firebaseConfig.projectId);
        console.log('📁 Colección: alumnos');
        console.log('✅ Múltiples disciplinas habilitadas');
    </script>
</body>
</html>
